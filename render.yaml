services:
  - type: web
    name: lensflow
    runtime: node
    region: singapore
    plan: free
    buildCommand: corepack enable && corepack prepare pnpm@10.19.0 --activate && pnpm run build:render
    startCommand: pnpm run start:render
    healthCheckPath: /api/healthz
    envVars:
      - key: NODE_VERSION
        value: 24.15.0
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      - key: DATABASE_URL
        fromDatabase:
          name: lensflow-postgres
          property: connectionString
      - key: PUBLIC_BASE_URL
        sync: false
      - key: ISSUER_URL
        sync: false
      - key: OIDC_CLIENT_ID
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: APIFY_API_TOKEN
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: HEYGEN_API_KEY
        sync: false
      - key: DID_API_KEY
        sync: false
      - key: GEMINI_LENSFLOW_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: SHOTSTACK_PROD_API_KEY
        sync: false
      - key: SHOTSTACK_PRODUCTION_API_KEY
        sync: false
      - key: SHOTSTACK_API_KEY
        sync: false
      - key: DOMAIN_CLIENT_ID
        sync: false
      - key: DOMAIN_CLIENT_SECRET
        sync: false
      - key: GOOGLE_MAPS_API_KEY
        sync: false
      - key: PUBLIC_OBJECT_SEARCH_PATHS
        sync: false
      - key: PRIVATE_OBJECT_DIR
        sync: false

databases:
  - name: lensflow-postgres
    region: singapore
    plan: free
    databaseName: lensflow
    user: lensflow
