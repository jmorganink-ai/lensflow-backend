kind = "web"
previewPath = "/pipeline/"
title = "LensFlow AI"
version = "1.0.0"
id = "artifacts/lensflow"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/pipeline/" ]
localPort = 20161

[services.development]
run = "pnpm --filter @workspace/lensflow run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/lensflow", "run", "build" ]
publicDir = "artifacts/lensflow/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20161"
BASE_PATH = "/pipeline/"
