kind = "mobile"
previewPath = "/mobile/"
title = "LensFlow Mobile"
version = "1.0.0"
id = "artifacts/lensflow-mobile"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/mobile/" ]
localPort = 25401

[services.development]
run = "pnpm --filter @workspace/lensflow-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/lensflow-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/lensflow-mobile", "run", "serve" ]

[services.env]
PORT = "25401"
BASE_PATH = "/mobile/"
