kind = "web"
previewPath = "/"
title = "LensFlow Marketing Site"
version = "1.0.0"
id = "artifacts/lensflow-site"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23780

[services.development]
run = "pnpm --filter @workspace/lensflow-site run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/lensflow-site", "run", "build" ]
publicDir = "artifacts/lensflow-site/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23780"
BASE_PATH = "/"
