    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",

        "url": "https://www.lensflow.com.au/",
        "description": "LensFlow AI turns any property listing URL or photos into a professional AI-presenter video — automatic script, natural voiceover, and 4K render. Built for Australian real estate agents.",
        "offers": [
          {
            "@type": "Offer",

          },
          {

          },

            "priceCurrency": "AUD"
          }

        "publisher": {
          "@type": "Organization",
          "name": "LensFlow AI",

    <style>
      :root {
        --gold: #C9962A;
        --dark-bg: #0b0f19;
        --card-bg: #111827;
        --border: #1f2937;
        --text-main: #f3f4f6;
        --text-muted: #9ca3af;
      }
      body {
        font-family: 'Inter', sans-serif;
        background-color: var(--dark-bg);
        color: var(--text-main);
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        min-height: 100vh;
      }
      header {
        width: 100%;
        max-width: 1200px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 20px;
        box-sizing: border-box;
        border-bottom: 1px solid var(--border);
      }
      .logo {
        font-size: 22px;
        font-weight: 700;
        color: var(--gold);
        text-decoration: none;
      }
      .status-badge {
        background: rgba(52, 211, 153, 0.1);
        color: #34d399;
        padding: 6px 12px;
        border-radius: 20px;
        font-size: 13px;
        font-weight: 600;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .status-dot {
        width: 8px;
        height: 8px;
        background: #34d399;
        border-radius: 50%;
      }
      .main-container {
        width: 100%;
        max-width: 1200px;
        display: grid;
        grid-template-columns: 1fr;
        gap: 30px;
        padding: 40px 20px;
        box-sizing: border-box;
        flex-grow: 1;
      }
      @media(min-width: 768px) {
        .main-container { grid-template-columns: 1fr 1fr; }
      }
      .panel {
        background: var(--card-bg);
        padding: 30px;
        border-radius: 12px;
        border: 1px solid var(--border);
        box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
        display: flex;
        flex-direction: column;
      }
      .panel h2 { color: var(--gold); margin-top: 0; font-size: 22px; margin-bottom: 20px; }
      label { display: block; margin-bottom: 8px; font-weight: 600; font-size: 14px; color: var(--text-muted); }
      textarea {
        width: 100%;
        height: 180px;
        background: #030712;
        border: 1px solid #374151;
        color: #f9fafb;
        padding: 12px;
        border-radius: 6px;
        box-sizing: border-box;
        font-size: 15px;
        margin-bottom: 20px;
        resize: vertical;
        font-family: inherit;
      }
      select {
        width: 100%;
        padding: 12px;
        background: #030712;
        border: 1px solid #374151;
        color: #f9fafb;
        border-radius: 6px;
        font-size: 15px;
        margin-bottom: 25px;
      }
      .action-btn {
        width: 100%;
        background: var(--gold);
        color: var(--dark-bg);
        border: none;
        padding: 14px;
        font-size: 16px;
        font-weight: 700;
        border-radius: 6px;
        cursor: pointer;
        transition: background 0.15s ease;
      }
      .action-btn:hover { background: #b08221; }
      .action-btn:disabled { background: #1f2937; color: #4b5563; cursor: not-allowed; }
      .console-log {
        margin-top: 20px;
        background: #030712;
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 15px;
        font-family: monospace;
        font-size: 13px;
        color: #34d399;
        display: none;
        white-space: pre-wrap;
        max-height: 150px;
        overflow-y: auto;
      }
      .preview-box {
        background: #030712;
        border: 1px solid var(--border);
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 400px;
        position: relative;
        overflow: hidden;
      }
      video { width: 100%; height: 100%; max-height: 550px; display: none; border-radius: 11px; object-fit: contain; }
      .placeholder-text { color: var(--text-muted); text-align: center; padding: 40px; font-size: 15px; max-width: 400px; }
    </style>
  </head>
  <body>

    <header>
      <a href="#" class="logo">LensFlow AI</a>
      <div class="status-badge">
        <div class="status-dot"></div> Connected to Production Backend
      </div>
    </header>

    <main class="main-container">
      <!-- Left Side: Control Console Form -->
      <div class="panel">
        <h2>AI Video Generation Studio</h2>

        <label for="scriptInput">Property Listing Script / Video Prompt</label>
        <textarea id="scriptInput" placeholder="Paste your property description or custom teleprompter script here..."></textarea>

        <label for="avatarInput">AI Presenter Persona</label>
        <select id="avatarInput">
          <option value="Mia">Mia (Real Estate Specialist)</option>
          <option value="Oliver">Oliver (Property Executive)</option>
          <option value="James">James (Auctioneer & Suburb Expert)</option>
        </select>

        <button id="submitBtn" class="action-btn" onclick="dispatchPipelineJob()">Generate & Deliver Video</button>
        <div id="logger" class="console-log"></div>
      </div>

      <!-- Right Side: Real-Time Preview Area -->
      <div class="preview-box">
        <div id="placeholderText" class="placeholder-text">
          <p style="font-size: 54px; margin: 0 0 15px 0;">🎬</p>
          Your generated property presenter video will render and play directly inside this interface.
        </div>
        <video id="videoPreview" controls></video>
      </div>
    </main>

    <script>
      const TARGET_ENDPOINT = 'https://lensflow-backend.onrender.com/generate-video';

      async function dispatchPipelineJob() {
        const script = document.getElementById('scriptInput').value.trim();
        const avatar = document.getElementById('avatarInput').value;
        const btn = document.getElementById('submitBtn');
        const logger = document.getElementById('logger');
        const video = document.getElementById('videoPreview');
        const placeholder = document.getElementById('placeholderText');

        if (!script) {
          alert("Execution halted: Script body cannot be empty.");
          return;
        }

        btn.disabled = true;
        btn.innerText = "Transmitting to Render Backend...";
        video.style.display = "none";
        placeholder.style.display = "block";
        logger.style.display = "block";
        logger.innerHTML = `[OUTBOUND] Packaging payloads...\n[DATA] Prompt: "${script.substring(0, 30)}..."\n[DATA] Avatar: ${avatar}\n[STATUS] Shipping packet to Render infrastructure...`;

        try {
          const response = await fetch(TARGET_ENDPOINT, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ prompt: script, avatar: avatar })
          });

          if (!response.ok) throw new Error(`HTTP network failure. Code: ${response.status}`);
          const data = await response.json();

          logger.innerHTML += `\n[INBOUND] Response packet received. Status 200.`;
          console.log("Pipeline payload return:", data);

          if (data.videoUrl) {
            logger.innerHTML += `\n[SUCCESS] Render pipeline delivered media asset. Loading player.`;
            placeholder.style.display = "none";
            video.src = data.videoUrl;
            video.style.display = "block";
          } else {
            logger.innerHTML += `\n[ERROR] Request succeeded but backend omitted 'videoUrl'. Check backend logs.`;
          }
        } catch (err) {
          logger.innerHTML += `\n[CRITICAL FAILURE] Pipeline execution aborted.\n[REASON] ${err.message}`;
        } finally {
          btn.disabled = false;
          btn.innerText = "Generate & Deliver Video";
        }
      }
    </script>

  </body>
</html>
