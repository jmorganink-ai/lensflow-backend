<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LENSFLOW | 4K Recording Studio</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;700&display=swap">
    <style>
        :root { --brand: #ff6b00; --dark: #0a0a0a; --glass: rgba(255, 255, 255, 0.1); }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'DM Sans', sans-serif; background: #000; color: #fff; overflow: hidden; height: 100vh; }

        /* CAMERA BACKGROUND */
        #video-preview { position: fixed; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1; transform: scaleX(-1); }

        /* TELEPROMPTER OVERLAY */
        .prompter-layer { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; display: flex; flex-direction: column; align-items: center; pointer-events: none; }

        /* FOCUS ZONE */
        .focus-zone { position: absolute; top: 20%; width: 90%; height: 180px; border: 2px solid var(--brand); border-radius: 15px; background: rgba(0,0,0,0.3); box-shadow: 0 0 50px rgba(0,0,0,0.8); z-index: 11; overflow: hidden; pointer-events: auto; }
        #script-text { padding: 20px; font-size: 32px; line-height: 1.4; font-weight: 700; color: #fff; text-align: center; white-space: pre-wrap; transform: translateY(0); transition: transform 0.1s linear; }

        /* CONTROLS */
        .controls { position: fixed; bottom: 30px; left: 0; right: 0; z-index: 100; display: flex; justify-content: space-around; align-items: center; padding: 0 20px; pointer-events: auto; }
        .btn-circle { width: 70px; height: 70px; border-radius: 50%; border: none; background: var(--glass); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 24px; backdrop-filter: blur(10px); }
        .btn-record { width: 90px; height: 90px; background: #ff0000; border: 5px solid #fff; box-shadow: 0 0 20px rgba(255,0,0,0.5); }
        .btn-record.active { border-radius: 15px; animation: pulse 1.5s infinite; }

        /* SETTINGS PANEL */
        .settings-bar { position: fixed; top: 20px; right: 20px; z-index: 100; background: var(--glass); padding: 15px; border-radius: 20px; backdrop-filter: blur(20px); width: 220px; }
        .setting-row { margin-bottom: 15px; }
        .setting-row label { display: block; font-size: 10px; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 5px; opacity: 0.6; }
        input[type="range"] { width: 100%; accent-color: var(--brand); }

        /* COUNTDOWN */
        #countdown { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); font-family: 'Bebas Neue'; font-size: 200px; color: var(--brand); z-index: 200; display: none; text-shadow: 0 10px 50px rgba(0,0,0,0.5); }

        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }
    </style>
</head>
<body>

    <video id="video-preview" autoplay playsinline muted></video>

    <div id="countdown">3</div>

    <div class="prompter-layer">
        <div class="focus-zone" id="focus-zone">
            <div id="script-text">PASTE YOUR SCRIPT IN THE SETTINGS...</div>
        </div>
    </div>

    <div class="settings-bar">
        <div class="setting-row">
            <label>Scroll Speed</label>
            <input type="range" id="speed-slider" min="1" max="50" value="25">
        </div>
        <div class="setting-row">
            <label>Text Size</label>
            <input type="range" id="size-slider" min="20" max="60" value="32">
        </div>
        <textarea id="script-input" style="width: 100%; height: 80px; background: rgba(255,255,255,0.1); border: none; color: white; padding: 10px; border-radius: 5px; font-size: 12px;" placeholder="Enter property script here..."></textarea>
    </div>

    <div class="controls">
        <button class="btn-circle" onclick="location.href='index.html'">✕</button>
        <button class="btn-circle btn-record" id="record-btn"></button>
        <button class="btn-circle" id="settings-btn">⚙️</button>
    </div>

    <script>
        const video = document.getElementById('video-preview');
        const scriptDisplay = document.getElementById('script-text');
        const scriptInput = document.getElementById('script-input');
        const recordBtn = document.getElementById('record-btn');
        const countdownEl = document.getElementById('countdown');
        const speedSlider = document.getElementById('speed-slider');
        const sizeSlider = document.getElementById('size-slider');

        let isRecording = false;
        let scrollInterval;
        let scrollPos = 180; // Start at bottom of focus zone

        // 1. ACCESS CAMERA
        async function startCamera() {
            const stream = await navigator.mediaDevices.getUserMedia({ 
                video: { width: 3840, height: 2160, facingMode: "user" }, // Attempt 4K
                audio: true 
            });
            video.srcObject = stream;
        }

        // 2. TEXT SYNC
        scriptInput.addEventListener('input', () => {
            scriptDisplay.innerText = scriptInput.value || "PASTE YOUR SCRIPT IN THE SETTINGS...";
        });

        sizeSlider.addEventListener('input', () => {
            scriptDisplay.style.fontSize = sizeSlider.value + 'px';
        });

        // 3. START RECORDING & SCROLL
        recordBtn.onclick = () => {
            if (!isRecording) {
                let count = 3;
                countdownEl.style.display = 'block';
                const timer = setInterval(() => {
                    count--;
                    countdownEl.innerText = count;
                    if (count === 0) {
                        clearInterval(timer);
                        countdownEl.style.display = 'none';
                        startFlow();
                    }
                }, 1000);
            } else {
                stopFlow();
            }
        };

        function startFlow() {
            isRecording = true;
            recordBtn.classList.add('active');
            scrollPos = 180; 

            const speed = 51 - speedSlider.value; // Invert slider for logic
            scrollInterval = setInterval(() => {
                scrollPos -= 1;
                scriptDisplay.style.transform = `translateY(${scrollPos}px)`;

                // Reset if reached end
                if (Math.abs(scrollPos) > scriptDisplay.offsetHeight + 200) {
                    stopFlow();
                }
            }, speed);
        }

        function stopFlow() {
            isRecording = false;
            recordBtn.classList.remove('active');
            clearInterval(scrollInterval);
            scriptDisplay.style.transform = `translateY(0px)`;
        }

        startCamera();
    </script>
</body>
</html>
