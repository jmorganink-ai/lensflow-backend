<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LensFlow Studio</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #0f1117; color: #e2e8f0; margin: 0; padding: 20px; }
    .container { max-width: 1000px; margin: 0 auto; }
    h1 { color: #818cf8; }
    button { padding: 12px 24px; background: #4f46e5; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; }
    button:hover { background: #6366f1; }
    .recorder { margin: 30px 0; padding: 20px; background: #1a1d2e; border-radius: 12px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>LensFlow AI Studio</h1>
    <p>Real Estate Video Pipeline Studio</p>

    <div class="recorder">
      <h2>Video Recorder + Teleprompter</h2>
      <button onclick="startRecording()">Start Recording</button>
      <button onclick="stopRecording()">Stop Recording</button>
      <video id="preview" autoplay playsinline style="width:100%; max-height:400px; background:black; margin-top:10px;"></video>
    </div>

    <div>
      <h3>Status</h3>
      <pre id="status">Ready</pre>
    </div>
  </div>

  <script>
    let mediaRecorder;
    let recordedChunks = [];
    let stream;

    async function startRecording() {
      try {
        stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
        document.getElementById('preview').srcObject = stream;

        mediaRecorder = new MediaRecorder(stream);
        recordedChunks = [];

        mediaRecorder.ondataavailable = (event) => {
          if (event.data.size > 0) recordedChunks.push(event.data);
        };

        mediaRecorder.onstop = () => {
          const blob = new Blob(recordedChunks, { type: 'video/mp4' });
          const url = URL.createObjectURL(blob);
          console.log("Recording saved. URL:", url);
          document.getElementById('status').textContent = "Recording saved! Ready for next step.";
        };

        mediaRecorder.start();
        document.getElementById('status').textContent = "Recording...";
      } catch (err) {
        document.getElementById('status').textContent = "Error: " + err.message;
      }
    }

    function stopRecording() {
      if (mediaRecorder && mediaRecorder.state !== "inactive") {
        mediaRecorder.stop();
        stream.getTracks().forEach(track => track.stop());
      }
    }
  </script>
</body>
</html>
