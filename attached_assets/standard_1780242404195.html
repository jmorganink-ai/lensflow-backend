<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
    <title>LENSFLOW — Standard Professional</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Sans:wght@400;500;700&family=Bebas+Neue&display=swap">
    <style>
        :root { --navy:#0a0f1e; --gold:#c9a84c; --white:#ffffff; --surface:rgba(255,255,255,0.05); }
        body { font-family:"DM Sans", sans-serif; background:var(--navy); color:var(--white); margin:0; text-align:center; }
        
        .hero-section { padding: 80px 20px; background: linear-gradient(rgba(10,15,30,0.7), rgba(10,15,30,0.7)), url('standard.jpg') center/cover; }
        h1 { font-family: 'Playfair Display', serif; font-size: 3rem; margin-bottom: 10px; }
        .tag { font-family: 'Bebas Neue'; color: var(--gold); font-size: 1.4rem; letter-spacing: 2px; }
        
        .info-grid { max-width: 900px; margin: 40px auto; display: grid; grid-template-columns: 1fr 1fr; gap: 30px; padding: 20px; }
        .info-card { background: var(--surface); padding: 30px; border-radius: 4px; border: 1px solid rgba(255,255,255,0.1); text-align: left; }
        .info-card h3 { font-family: 'Bebas Neue'; color: var(--gold); font-size: 1.5rem; margin-bottom: 10px; }
        
        .btn-outline { 
            display: inline-block; border: 2px solid var(--gold); color: var(--gold); 
            padding: 15px 40px; text-decoration: none; font-family: 'Bebas Neue'; 
            font-size: 1.2rem; margin-top: 30px; transition: 0.3s;
        }
        .btn-outline:hover { background: var(--gold); color: var(--navy); }
    </style>
</head>
<body>

    <div class="hero-section">
        <p class="tag">Essential Production</p>
        <h1>STANDARD PRO</h1>
    </div>

    <div class="info-grid">
        <div class="info-card">
            <h3>HD Teleprompter</h3>
            <p>Smooth, flicker-free scrolling for crystal clear delivery on every take.</p>
        </div>
        <div class="info-card">
            <h3>Script Library</h3>
            <p>Save up to 10 active listing scripts directly on your device.</p>
        </div>
    </div>

    <p>Ready to unlock 4K and Custom Branding?</p>
    <a href="billing.html" class="btn-outline">VIEW UPGRADE OPTIONS</a>

</body>
</html>
