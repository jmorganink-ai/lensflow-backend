<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GrokVault — Mutual Consent</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root { --gold: #d4af37; --red: #ef4444; --green: #22c55e; }
  body { font-family: system-ui, sans-serif; background:#0a0f1c; color:#e2e8f0; margin:0; }
  .container { max-width: 560px; margin:0 auto; padding:20px; }
  .card { background:#1e2937; border:1px solid #475569; border-radius:16px; padding:24px; margin:20px 0; }
  .btn { width:100%; padding:16px; border:none; border-radius:12px; font-weight:600; margin-top:12px; cursor:pointer; }
  .btn-primary { background:var(--gold); color:#0f172a; }
  .btn-red { background:var(--red); color:white; }
  .teleprompter { position:relative; height:380px; background:#000; border-radius:12px; overflow:hidden; margin:20px 0; }
  #preview { width:100%; height:100%; object-fit:cover; }
  #tpText { position:absolute; top:100%; left:0; right:0; padding:40px 30px; font-size:21px; line-height:1.65; text-align:center; color:white; transition:transform 0.04s linear; }
  #waveform { position:absolute; bottom:0; left:0; right:0; height:90px; background:rgba(0,0,0,0.7); }
</style>
</head>
<body>

<div class="container">
  <h1 style="text-align:center;color:var(--gold)">GrokVault</h1>

  <div id="teleScreen" class="card">
    <h3 id="scriptTitle">Initial Consent Recording</h3>
    <div class="teleprompter">
      <video id="preview" autoplay playsinline></video>
      <div id="tpText"></div>
      <canvas id="waveform" width="560" height="90"></canvas>
    </div>
    <div id="faceStatus" style="padding:10px;background:#334155;border-radius:8px;text-align:center;margin:10px 0;">Waiting for camera...</div>

    <div style="display:flex;gap:10px">
      <button onclick="startRecording()" class="btn btn-primary" id="startBtn">▶ Start Recording</button>
      <button onclick="stopRecording()" class="btn btn-red" id="stopBtn" style="display:none">■ Stop Recording</button>
    </div>
  </div>

  <div id="certScreen" class="card" style="display:none">
    <h3>Certificate Generated</h3>
    <div id="certPreview" style="background:#fff;color:#111;padding:20px;border-radius:8px;margin:20px 0"></div>
    <button onclick="downloadPDF()" class="btn btn-primary">📄 Download PDF Certificate</button>
  </div>
</div>

<button onclick="triggerSOS()" style="position:fixed;bottom:30px;right:30px;width:76px;height:76px;background:#ef4444;color:white;border:none;border-radius:50%;font-size:32px;box-shadow:0 10px 40px rgba(239,68,68,0.6)">🚨</button>

<script>
let stream, recorder, chunks = [], scrollInterval, audioContext, analyser, dataArray, canvas, ctx, animationFrame;
let currentScript = 0;

const scripts = [
  {title:"Initial Consent", text:"My name is [Your Name]. Today is " + new Date().toLocaleDateString('en-AU') + ". I am giving my free, voluntary consent..."},
  {title:"Closing Statement", text:"The encounter has concluded. I confirm everything was consensual."}
];

function loadScript() {
  document.getElementById('scriptTitle').textContent = scripts[currentScript].title;
  document.getElementById('tpText').innerHTML = scripts[currentScript].text.replace(/\n/g, '<br><br>');
}

async function startRecording() {
  stream = await navigator.mediaDevices.getUserMedia({ video: {facingMode:"user"}, audio:true });
  document.getElementById('preview').srcObject = stream;

  // Web Audio API Setup
  audioContext = new (window.AudioContext || window.webkitAudioContext)();
  analyser = audioContext.createAnalyser();
  const source = audioContext.createMediaStreamSource(stream);
  source.connect(analyser);
  analyser.fftSize = 256;
  dataArray = new Uint8Array(analyser.frequencyBinCount);

  canvas = document.getElementById('waveform');
  ctx = canvas.getContext('2d');

  recorder = new MediaRecorder(stream);
  chunks = [];
  recorder.ondataavailable = e => chunks.push(e.data);
  recorder.onstop = () => {
    document.getElementById('teleScreen').style.display = 'none';
    document.getElementById('certScreen').style.display = 'block';
    generateCert();
  };
  recorder.start();

  document.getElementById('startBtn').style.display = 'none';
  document.getElementById('stopBtn').style.display = 'block';
  startTeleprompter();
  drawWaveform();
}

function drawWaveform() {
  function draw() {
    animationFrame = requestAnimationFrame(draw);
    analyser.getByteTimeDomainData(dataArray);

    ctx.fillStyle = 'rgba(10,15,28,0.85)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.lineWidth = 3.5;
    ctx.strokeStyle = '#d4af37';
    ctx.shadowColor = '#d4af37';
    ctx.shadowBlur = 8;
    ctx.beginPath();

    const sliceWidth = canvas.width / dataArray.length;
    let x = 0;

    for (let i = 0; i < dataArray.length; i++) {
      const v = dataArray[i] / 128.0;
      const y = (v * canvas.height) / 2;

      if (i === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);

      x += sliceWidth;
    }
    ctx.lineTo(canvas.width, canvas.height / 2);
    ctx.stroke();
  }
  draw();
}

function startTeleprompter() {
  let pos = -300;
  scrollInterval = setInterval(() => {
    pos += 1.45;
    document.getElementById('tpText').style.transform = `translateY(-${pos}px)`;
  }, 30);
}

function stopRecording() {
  if (recorder) recorder.stop();
  if (stream) stream.getTracks().forEach(t => t.stop());
  if (animationFrame) cancelAnimationFrame(animationFrame);
  clearInterval(scrollInterval);
}

function generateCert() {
  const id = "GV-" + Math.random().toString(36).substr(2,9).toUpperCase();
  document.getElementById('certPreview').innerHTML = `
    <h2 style="text-align:center;color:#0f172a">Mutual Consent Certificate</h2>
    <p><strong>Session ID:</strong> ${id}</p>
    <p><strong>Date:</strong> ${new Date().toLocaleString('en-AU')}</p>
    <p>Live audio waveform captured during recording.</p>
  `;
}

function downloadPDF() {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  doc.setFontSize(20);
  doc.text("Mutual Consent Certificate", 105, 25, { align: "center" });
  doc.save("GrokVault_Certificate.pdf");
}

function changeScript() {
  currentScript = (currentScript + 1) % scripts.length;
  loadScript();
}

function triggerSOS() {
  if (confirm("🚨 Withdraw consent and trigger emergency alert?")) {
    alert("🚨 Emergency logged with GPS and timestamp.");
  }
}

// Initialize
loadScript();
</script>

</body>
</html>
