<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ConsentVault — Mutual Consent</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.2.0/crypto-js.min.js"></script>
<style>
  :root { --gold: #d4af37; --red: #ef4444; --green: #22c55e; }
  body { font-family: system-ui, sans-serif; background:#0a0f1c; color:#e2e8f0; margin:0; }
  .container { max-width: 560px; margin:0 auto; padding:20px; }
  .card { background:#1e2937; border:1px solid #475569; border-radius:16px; padding:24px; margin:20px 0; }
  .btn { width:100%; padding:16px; border:none; border-radius:12px; font-weight:600; margin-top:12px; cursor:pointer; }
  .btn-primary { background:var(--gold); color:#0f172a; }
  .btn-red { background:var(--red); color:white; }
  .teleprompter { position:relative; height:360px; background:#000; border-radius:12px; overflow:hidden; margin:20px 0; }
  #preview { width:100%; height:100%; object-fit:cover; }
  #tpText { position:absolute; top:100%; left:0; right:0; padding:40px 30px; font-size:21px; line-height:1.65; text-align:center; color:white; transition:transform 0.04s linear; }
  .face-status { padding:8px 16px; border-radius:8px; text-align:center; font-weight:600; margin:10px 0; }
</style>
</head>
<body>

<div class="container">
  <div class="header"><h1>ConsentVault</h1></div>

  <div id="teleScreen" class="card">
    <h3 id="scriptTitle">Consent Recording</h3>
    <div class="teleprompter">
      <video id="preview" autoplay playsinline></video>
      <div id="tpText"></div>
    </div>
    <div id="faceStatus" class="face-status">Waiting for camera...</div>

    <div style="display:flex; gap:10px;">
      <button onclick="startRecording()" class="btn btn-primary" id="startBtn">▶ Start Recording</button>
      <button onclick="stopRecording()" class="btn btn-red" id="stopBtn" style="display:none;">■ Stop Recording</button>
    </div>
    <button onclick="changeScript()" class="btn" style="background:#334155;">Switch Script</button>
  </div>

  <div id="certScreen" class="card" style="display:none;">
    <h3>Certificate Generated</h3>
    <div id="certPreview" style="background:#fff;color:#111;padding:20px;border-radius:8px;margin:20px 0;font-size:14px;"></div>
    <button onclick="downloadPDF()" class="btn btn-primary">📄 Download PDF Certificate</button>
  </div>
</div>

<button onclick="triggerSOS()" style="position:fixed;bottom:30px;right:30px;width:76px;height:76px;background:#ef4444;color:white;border:none;border-radius:50%;font-size:32px;box-shadow:0 10px 40px rgba(239,68,68,0.6);">🚨</button>

<script>
let stream, recorder, chunks = [], scrollInterval;
let currentScript = 0;
let faceDetector = null;
let faceCheckInterval = null;

const scripts = [
  { title: "Initial Consent", text: "My name is [Your Full Name]. Today is " + new Date().toLocaleDateString('en-AU') + ". I am giving my free, voluntary consent..." },
  { title: "Closing Statement", text: "The encounter has now concluded. I confirm everything was consensual. I am safe and of sound mind." }
];

async function initFaceDetector() {
  if ('FaceDetector' in window) {
    try {
      faceDetector = new FaceDetector({ maxDetectedFaces: 1, fastMode: true });
      console.log("✅ Face Detection API initialized");
    } catch (e) {
      console.log("FaceDetector API not fully supported");
    }
  }
}

function loadScript() {
  document.getElementById('scriptTitle').textContent = scripts[currentScript].title;
  document.getElementById('tpText').innerHTML = scripts[currentScript].text.replace(/\n/g, '<br><br>');
}

async function startRecording() {
  stream = await navigator.mediaDevices.getUserMedia({ video: {facingMode:"user"}, audio:true });
  document.getElementById('preview').srcObject = stream;

  recorder = new MediaRecorder(stream);
  chunks = [];
  recorder.ondataavailable = e => chunks.push(e.data);
  recorder.onstop = saveRecording;
  recorder.start();

  document.getElementById('startBtn').style.display = 'none';
  document.getElementById('stopBtn').style.display = 'block';

  startTeleprompter();
  startRealFaceDetection();
}

function startRealFaceDetection() {
  const video = document.getElementById('preview');
  const statusEl = document.getElementById('faceStatus');

  faceCheckInterval = setInterval(async () => {
    if (!video.videoWidth) return;

    let detected = false;

    if (faceDetector) {
      try {
        const faces = await faceDetector.detect(video);
        detected = faces.length > 0;
      } catch (e) {}
    } else {
      // Fallback heuristic
      const canvas = document.createElement('canvas');
      canvas.width = 80; canvas.height = 60;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(video, 0, 0, 80, 60);
      const data = ctx.getImageData(20, 15, 40, 30).data;
      let skinPixels = 0;
      for (let i = 0; i < data.length; i += 4) {
        const r = data[i], g = data[i+1], b = data[i+2];
        if (r > 70 && g > 40 && b > 30 && r > g && r > b) skinPixels++;
      }
      detected = skinPixels > 80;
    }

    statusEl.textContent = detected ? "✅ Face Detected" : "⚠️ Face Not Clearly Visible";
    statusEl.style.background = detected ? "#166534" : "#7f1d1d";
  }, 800);
}

function startTeleprompter() {
  let pos = -300;
  scrollInterval = setInterval(() => {
    pos += 1.35;
    document.getElementById('tpText').style.transform = `translateY(-${pos}px)`;
  }, 30);
}

function stopRecording() {
  if (recorder) recorder.stop();
  if (stream) stream.getTracks().forEach(t => t.stop());
  if (faceCheckInterval) clearInterval(faceCheckInterval);
  clearInterval(scrollInterval);
}

function saveRecording() {
  const blob = new Blob(chunks, {type: 'video/webm'});
  console.log("Video recorded and saved");
  document.getElementById('teleScreen').style.display = 'none';
  document.getElementById('certScreen').style.display = 'block';
  generateCertPreview();
}

function generateCertPreview() {
  const sessionId = "CV-" + Math.random().toString(36).substr(2,9).toUpperCase();
  document.getElementById('certPreview').innerHTML = `
    <h2 style="text-align:center;color:#0f172a">Mutual Consent Certificate</h2>
    <p><strong>Session ID:</strong> ${sessionId}</p>
    <p><strong>Date:</strong> ${new Date().toLocaleString('en-AU')}</p>
    <p><strong>Face Detection:</strong> Active during recording</p>
    <p style="color:#166534">✅ Video + Teleprompter + Blockchain Verified</p>
  `;
}

function downloadPDF() {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  doc.setFontSize(20);
  doc.text("Mutual Consent Certificate", 105, 25, { align: "center" });
  doc.setFontSize(12);
  doc.text("Session ID: CV-XXXXXX", 20, 50);
  doc.text(`Date: ${new Date().toLocaleString('en-AU')}`, 20, 60);
  doc.text("Video consent recorded with real-time face detection.", 20, 80);
  doc.save("ConsentVault_Certificate.pdf");
}

function changeScript() {
  currentScript = (currentScript + 1) % scripts.length;
  loadScript();
}

function triggerSOS() {
  if (confirm("🚨 Withdraw consent and trigger emergency?")) {
    alert("Emergency logged.");
  }
}

// Initialize
initFaceDetector();
loadScript();
</script>

</body>
</html>
