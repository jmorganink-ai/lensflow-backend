<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>LensFlow Studio | Elite AI Video</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Bebas+Neue&display=swap">
<style>
:root { --accent: #ff6b00; --bg: #0a0a0a; --panel: #1a1a1a; --text: #ffffff; }
body { font-family: "DM Sans", sans-serif; background: var(--bg); color: var(--text); margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

header { padding: 20px; border-bottom: 1px solid rgba(255,255,255,0.1); display: flex; justify-content: space-between; align-items: center; }
.logo { font-weight: 800; font-size: 1.2rem; letter-spacing: 1px; }
.badge { background: var(--accent); color: #000; padding: 4px 12px; border-radius: 20px; font-size: 10px; font-weight: 800; }

.stage { flex: 1; position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; background: radial-gradient(circle, #1a1a1a 0%, #000000 100%); }

/* Twin Selector */
.twin-selector { display: flex; gap: 20px; margin-bottom: 25px; z-index: 10; }
.twin-option { text-align: center; cursor: pointer; transition: 0.3s; opacity: 0.4; }
.twin-option.active { opacity: 1; transform: scale(1.1); }
.twin-option img { width: 70px; height: 70px; border-radius: 50%; border: 2px solid transparent; object-fit: cover; margin-bottom: 8px; }
.twin-option.active img { border-color: var(--accent); box-shadow: 0 0 15px rgba(255,107,0,0.5); }
.twin-label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; }

#avatar-container { width: 300px; height: 300px; border-radius: 50%; border: 4px solid rgba(255,107,0,0.2); overflow: hidden; position: relative; box-shadow: 0 0 50px rgba(0,0,0,0.5); }
#avatar-container img, #avatar-container video { width: 100%; height: 100%; object-fit: cover; }

.input-area { padding: 25px; background: var(--panel); border-radius: 30px 30px 0 0; box-shadow: 0 -10px 30px rgba(0,0,0,0.5); }
textarea { width: 100%; height: 90px; background: transparent; border: none; color: #fff; font-size: 16px; resize: none; margin-bottom: 15px; outline: none; line-height: 1.5; }
.btn-generate { width: 100%; padding: 20px; background: var(--accent); border: none; border-radius: 16px; font-weight: 800; font-size: 14px; text-transform: uppercase; cursor: pointer; transition: 0.2s; }
.btn-generate:active { transform: scale(0.98); opacity: 0.9; }

.bottom-nav { display: grid; grid-template-columns: repeat(4, 1fr); padding: 15px 0; background: var(--panel); border-top: 1px solid rgba(255,255,255,0.05); }
.nav-item { display: flex; flex-direction: column; align-items: center; font-size: 10px; opacity: 0.4; font-weight: 600; }
.nav-item.active { opacity: 1; color: var(--accent); }
</style>
</head>
<body>
<nav style="position:fixed;top:0;left:0;right:0;z-index:100;padding:12px 24px;display:flex;align-items:center;justify-content:space-between;background:rgba(0,0,0,0.95);backdrop-filter:blur(20px);border-bottom:1px solid rgba(255,107,0,0.2);"><a href="index.html" style="font-family:Bebas Neue,sans-serif;font-size:20px;color:#ff6b00;text-decoration:none;letter-spacing:2px;">LENSFLOW</a><div style="display:flex;gap:10px;"><a href="studio.html" style="color:rgba(255,255,255,0.6);text-decoration:none;font-size:12px;font-weight:600;padding:6px 12px;">Studio</a><a href="billing.html" style="color:rgba(255,255,255,0.6);text-decoration:none;font-size:12px;font-weight:600;padding:6px 12px;">Pricing</a><a href="concierge.html" style="background:#ff6b00;color:#000;padding:8px 16px;border-radius:20px;text-decoration:none;font-size:12px;font-weight:800;">Concierge</a></div></nav>

<header>
  <div class="logo">LENSFLOW</div>
  <div class="badge">ELITE BUILD</div>
</header>

<div class="stage">
  <div class="twin-selector">
    <div class="twin-option active" id="opt-oliver" onclick="switchTwin('oliver')">
      <img src="Oliver_Headshot.jpg" alt="Oliver">
      <div class="twin-label">Oliver</div>
    </div>
    <div class="twin-option" id="opt-mia" onclick="switchTwin('mia')">
      <img src="Mia_Headshot.jpg" alt="Mia">
      <div class="twin-label">Mia</div>
    </div>
  </div>
  
  <div id="avatar-container">
    <img src="Oliver_Headshot.jpg" id="target-img">
    <video id="output-video" hidden autoplay controls></video>
  </div>
</div>

<div class="input-area">
  <textarea id="script-box" placeholder="Paste your property listing script here..."></textarea>
  <button class="btn-generate" onclick="generatePrestigeVideo()">Sync Digital Twin</button>
</div>

<nav class="bottom-nav">
  <div class="nav-item active">AVATAR</div>
  <div class="nav-item">SCRIPT</div>
  <div class="nav-item">VOICE</div>
  <div class="nav-item">FINISH</div>
</nav>

<script>
// API Configurations
const DID_KEY = "Am1vcmdhbmlua0BnbWFpbC5jb20:eQT6WNCG0yiq-rdmjcqh8";
const XI_KEY = "sk_dfe62ecf54641d12cae8320534231e8c1fb03abe4d933c26";

const OLIVER_VOICE_ID = "Ur3kBH0MOhvbYUg19zzx";
const MIA_VOICE_ID = "EXAVITQu4vr4xnSDxMaL";

let currentVoiceId = OLIVER_VOICE_ID;

function switchTwin(name) {
  const targetImg = document.getElementById('target-img');
  const optOliver = document.getElementById('opt-oliver');
  const optMia = document.getElementById('opt-mia');
  
  if(name === 'oliver') {
    targetImg.src = 'Oliver_Headshot.jpg';
    currentVoiceId = OLIVER_VOICE_ID;
    optOliver.classList.add('active');
    optMia.classList.remove('active');
    new Audio('voice_preview_oliver calm professional agency.mp3').play();
  } else {
    targetImg.src = 'Mia_Headshot.jpg';
    currentVoiceId = MIA_VOICE_ID;
    optMia.classList.add('active');
    optOliver.classList.remove('active');
    new Audio('voice_preview_emma.mp3').play();
  }
}

async function generatePrestigeVideo() {
  const btn = document.querySelector('.btn-generate');
  const script = document.getElementById('script-box').value;
  
  if(!script) return alert("Please enter a script first.");

  btn.innerHTML = "Generating AI Voice...";
  btn.disabled = true;

  try {
    // Step 1: Trigger ElevenLabs
    const xiResponse = await fetch(`https://api.elevenlabs.io/v1/text-to-speech/${currentVoiceId}`, {
      method: 'POST',
      headers: { 'xi-api-key': XI_KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify({ 
        text: script, 
        model_id: "eleven_multilingual_v2",
        voice_settings: { stability: 0.45, similarity_boost: 0.75 }
      })
    });

    if(!xiResponse.ok) throw new Error("Voice Sync Failed");

    btn.innerHTML = "Initializing D-ID Sync...";
    alert("Voice generated successfully. Connecting to D-ID for 4K video rendering...");
    
    // Reset UI
    btn.innerHTML = "Sync Digital Twin";
    btn.disabled = false;

  } catch (err) {
    console.error(err);
    alert("Connection Error. Please check your API credits.");
    btn.innerHTML = "Sync Digital Twin";
    btn.disabled = false;
  }
}
</script>
</body>
</html>
