openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: LensFlow AI - Real estate video pipeline API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: jobs
    description: Pipeline job operations
  - name: webhooks
    description: Webhook operations
  - name: leads
    description: Lead capture operations
  - name: anthropic
    description: Anthropic AI chat operations (Morgan assistant)
  - name: elevenlabs
    description: ElevenLabs voice and TTS operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /jobs:
    get:
      operationId: listJobs
      tags: [jobs]
      summary: List all jobs
      responses:
        "200":
          description: List of jobs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Job"
    post:
      operationId: createJob
      tags: [jobs]
      summary: Create a new pipeline job
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JobInput"
      responses:
        "201":
          description: Job created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "400":
          description: Invalid input

  /jobs/stats:
    get:
      operationId: getJobStats
      tags: [jobs]
      summary: Get dashboard statistics
      responses:
        "200":
          description: Job statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobStats"

  /jobs/{id}/simulate:
    post:
      operationId: simulateJob
      tags: [jobs]
      summary: Start pipeline simulation for a job
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Simulation started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimulateResult"
        "400":
          description: Job already running or complete
        "404":
          description: Job not found

  /jobs/{id}:
    get:
      operationId: getJob
      tags: [jobs]
      summary: Get job with pipeline step details
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Job details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobDetail"
        "404":
          description: Job not found
    delete:
      operationId: deleteJob
      tags: [jobs]
      summary: Delete a job
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Job deleted
        "404":
          description: Job not found

  /webhooks:
    get:
      operationId: listWebhooks
      tags: [webhooks]
      summary: List all webhooks
      responses:
        "200":
          description: List of webhooks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Webhook"
    post:
      operationId: createWebhook
      tags: [webhooks]
      summary: Create a new webhook
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebhookInput"
      responses:
        "201":
          description: Webhook created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Webhook"
        "400":
          description: Invalid input

  /elevenlabs/voices:
    get:
      operationId: listElevenLabsVoices
      tags: [elevenlabs]
      summary: List available ElevenLabs voices
      responses:
        "200":
          description: List of voices
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ElevenLabsVoice"
        "500":
          description: ElevenLabs API error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ElevenLabsError"

  /anthropic/conversations:
    get:
      operationId: listAnthropicConversations
      tags: [anthropic]
      summary: List all conversations
      responses:
        "200":
          description: List of conversations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AnthropicConversation"
    post:
      operationId: createAnthropicConversation
      tags: [anthropic]
      summary: Create a new conversation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnthropicConversationInput"
      responses:
        "201":
          description: Created conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnthropicConversation"
  /anthropic/conversations/{id}:
    get:
      operationId: getAnthropicConversation
      tags: [anthropic]
      summary: Get conversation with messages
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Conversation with messages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnthropicConversationWithMessages"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnthropicError"
    delete:
      operationId: deleteAnthropicConversation
      tags: [anthropic]
      summary: Delete a conversation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnthropicError"
  /anthropic/conversations/{id}/messages:
    get:
      operationId: listAnthropicMessages
      tags: [anthropic]
      summary: List messages in a conversation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AnthropicMessage"
    post:
      operationId: sendAnthropicMessage
      tags: [anthropic]
      summary: Send a message and receive an AI response (SSE stream)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnthropicMessageInput"
      responses:
        "200":
          description: SSE stream of assistant response chunks
          content:
            text/event-stream: {}

  /leads:
    post:
      operationId: captureLead
      tags: [leads]
      summary: Capture a new lead email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LeadInput"
      responses:
        "201":
          description: Lead captured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeadResult"
        "400":
          description: Invalid input

  /leads/count:
    get:
      operationId: getLeadCount
      tags: [leads]
      summary: Get total lead count for urgency display
      responses:
        "200":
          description: Lead count
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeadCount"

  /webhooks/{id}:
    delete:
      operationId: deleteWebhook
      tags: [webhooks]
      summary: Delete a webhook
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Webhook deleted
        "404":
          description: Webhook not found

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    Job:
      type: object
      required: [id, listingUrl, listingTitle, status, createdAt, updatedAt]
      properties:
        id:
          type: string
        listingUrl:
          type: string
        listingTitle:
          type: ["string", "null"]
        status:
          type: string
          enum: [queued, processing, complete, failed]
        voiceId:
          type: ["string", "null"]
        voiceName:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    JobDetail:
      type: object
      required: [id, listingUrl, listingTitle, status, steps, createdAt, updatedAt]
      properties:
        id:
          type: string
        listingUrl:
          type: string
        listingTitle:
          type: ["string", "null"]
        status:
          type: string
          enum: [queued, processing, complete, failed]
        steps:
          type: array
          items:
            $ref: "#/components/schemas/PipelineStep"
        videoUrl:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    PipelineStep:
      type: object
      required: [id, name, status, order]
      properties:
        id:
          type: string
        name:
          type: string
          enum: [scrape_listing, generate_script, create_voiceover, presenter_video, compose_video]
        label:
          type: string
        status:
          type: string
          enum: [pending, running, complete, failed]
        order:
          type: integer
        startedAt:
          type: ["string", "null"]
          format: date-time
        completedAt:
          type: ["string", "null"]
          format: date-time
        errorMessage:
          type: ["string", "null"]
        outputUrl:
          type: ["string", "null"]

    JobInput:
      type: object
      required: [listingUrl]
      properties:
        listingUrl:
          type: string
          minLength: 1
        voiceId:
          type: string
        voiceName:
          type: string

    JobStats:
      type: object
      required: [total, queued, processing, complete, failed, recentJobs]
      properties:
        total:
          type: integer
        queued:
          type: integer
        processing:
          type: integer
        complete:
          type: integer
        failed:
          type: integer
        recentJobs:
          type: array
          items:
            $ref: "#/components/schemas/Job"

    Webhook:
      type: object
      required: [id, url, events, isActive, createdAt]
      properties:
        id:
          type: string
        url:
          type: string
        events:
          type: array
          items:
            type: string
        isActive:
          type: boolean
        secret:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time

    SimulateResult:
      type: object
      required: [message, jobId]
      properties:
        message:
          type: string
        jobId:
          type: string

    WebhookInput:
      type: object
      required: [url, events]
      properties:
        url:
          type: string
          minLength: 1
        events:
          type: array
          items:
            type: string
        secret:
          type: string

    AnthropicConversation:
      type: object
      required: [id, title, createdAt]
      properties:
        id:
          type: integer
        title:
          type: string
        createdAt:
          type: string
          format: date-time
    AnthropicMessage:
      type: object
      required: [id, conversationId, role, content, createdAt]
      properties:
        id:
          type: integer
        conversationId:
          type: integer
        role:
          type: string
        content:
          type: string
        createdAt:
          type: string
          format: date-time
    AnthropicConversationInput:
      type: object
      required: [title]
      properties:
        title:
          type: string
    AnthropicMessageInput:
      type: object
      required: [content]
      properties:
        content:
          type: string
    AnthropicConversationWithMessages:
      type: object
      required: [id, title, createdAt, messages]
      properties:
        id:
          type: integer
        title:
          type: string
        createdAt:
          type: string
          format: date-time
        messages:
          type: array
          items:
            $ref: "#/components/schemas/AnthropicMessage"
    ElevenLabsVoice:
      type: object
      required: [voice_id, name, category]
      properties:
        voice_id:
          type: string
        name:
          type: string
        category:
          type: string
        description:
          type: string
        preview_url:
          type: string
        labels:
          type: object
          additionalProperties:
            type: string
    ElevenLabsError:
      type: object
      required: [error]
      properties:
        error:
          type: string

    AnthropicError:
      type: object
      required: [error]
      properties:
        error:
          type: string

    LeadInput:
      type: object
      required: [email]
      properties:
        email:
          type: string
          minLength: 1
        name:
          type: string
        source:
          type: string

    LeadResult:
      type: object
      required: [success, message]
      properties:
        success:
          type: boolean
        message:
          type: string

    LeadCount:
      type: object
      required: [count, displayCount]
      properties:
        count:
          type: integer
        displayCount:
          type: integer
